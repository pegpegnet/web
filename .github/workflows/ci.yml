name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: No private keys in the repository
        run: "! git grep -I -l -e \"PRIVATE KEY-----\" -- ."
      - run: npm ci
      - run: npm run check
      - run: npm run check:content
      - run: npm run build
      - run: npm run budget
