name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: No private keys in the repository
        run: "! git grep -I -l -E \"BEGIN [A-Z ]*PRIVATE[ ]KEY\" -- ."
      - run: npm ci
      - run: npm run check:content
      - run: npm run build
      # After the build, so Next's generated route types are checked too
      - run: npm run typecheck
